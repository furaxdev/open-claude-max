# CI: checks that every skill is complete and consistent on each push.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repository files
        run: |
          for f in README.md ARCHITECTURE.md CHANGELOG.md LICENSE .gitignore; do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
          done

      - name: Check skill front matter
        run: |
          count=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            file="$dir/SKILL.md"
            test -f "$file" || { echo "Missing $file"; exit 1; }
            head -n 1 "$file" | grep -qx -- '---' || { echo "$file: no front matter"; exit 1; }
            grep -qx "name: $name" "$file" || { echo "$file: name must be $name"; exit 1; }
            grep -q '^description: ' "$file" || { echo "$file: no description"; exit 1; }
            count=$((count + 1))
          done
          test "$count" -gt 0

      - name: Check the non-affiliation warning
        run: |
          grep -q '\[!WARNING\]' README.md
          grep -q '\[!WARNING\]' skills/open-claude-max/SKILL.md
